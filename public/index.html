 <!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>炸金花 - 欢乐牌桌</title>
<style>
:root {
  --green: #075b3c;
  --green-dark: #033d29;
  --gold: #e9c66b;
  --cream: #fff4d8;
  --red: #c83c36;
  --text: #f9f2df;
}
* {
  box-sizing: border-box;
}
body {
  margin: 0;
  min-height: 100vh;
  color: var(--text);
  background: radial-gradient(ellipse at top, #183b31, #091b17 70%);
  font-family: Arial, "Microsoft YaHei", sans-serif;
}
button, input {
  font: inherit;
}
button {
  cursor: pointer;
  border: 0;
  border-radius: 9px;
  padding: 10px 15px;
  font-weight: bold;
  transition: transform .15s, filter .15s;
}
button:hover {
  filter: brightness(1.1);
}
button:active {
  transform: scale(.97);
}
button:disabled {
  opacity: .4;
  cursor: not-allowed;
}
.topbar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
  padding: 14px 20px;
  background: rgba(0,0,0,.35);
  border-bottom: 1px solid rgba(233,198,107,.35);
}
.brand {
  color: var(--gold);
  font-size: 23px;
  font-weight: 900;
  letter-spacing: 2px;
}
.status {
  color: #d7e8db;
  font-size: 13px;
  margin-top: 4px;
}
.top-actions {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
}
.btn-secondary {
  background: #263d35;
  color: white;
  border: 1px solid #61776a;
}
.btn-danger {
  background: #9e2929;
  color: white;
}
.page {
  width: min(1200px, 100%);
  margin: auto;
  padding: 18px;
}
.room-panel {
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 12px;
  margin-bottom: 16px;
}
.room-title {
  font-size: 19px;
  font-weight: bold;
}
.room-subtitle {
  color: #b8c9bf;
  font-size: 13px;
  margin-top: 5px;
}
.join-box {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}
input {
  min-width: 0;
  width: 150px;
  border: 1px solid #557466;
  border-radius: 9px;
  padding: 10px;
  background: #10271e;
  color: white;
  outline: none;
}
input:focus {
  border-color: var(--gold);
}
.table-wrap {
  position: relative;
  padding: 22px 10px;
  border-radius: 30px;
  background: rgba(0,0,0,.2);
  box-shadow: 0 15px 40px #0005;
}
.table {
  position: relative;
  width: 100%;
  min-height: 540px;
  border-radius: 50% / 43%;
  border: 12px solid #8b632b;
  outline: 3px solid #e9c66b;
  outline-offset: -7px;
  background: radial-gradient(
    ellipse at center,
    #148055 0%,
    #08613f 48%,
    #03462f 100%
  );
  box-shadow:
    inset 0 0 0 3px #cba253,
    inset 0 0 35px #002b1d,
    0 15px 25px #0008;
  overflow: hidden;
}
.table::before {
  content: "";
  position: absolute;
  inset: 15px;
  border: 1px solid rgba(233,198,107,.35);
  border-radius: inherit;
  pointer-events: none;
}
.table-label {
  position: absolute;
  top: 15px;
  left: 50%;
  transform: translateX(-50%);
  color: rgba(255,232,174,.55);
  font-size: 12px;
  letter-spacing: 5px;
  white-space: nowrap;
}
.seats {
  position: absolute;
  inset: 25px 20px;
}
.seat {
  position: absolute;
  width: 125px;
  min-height: 95px;
  padding: 8px;
  text-align: center;
  border-radius: 14px;
  background: rgba(0,25,16,.82);
  border: 1px solid rgba(255,255,255,.14);
  box-shadow: 0 5px 12px #001c1280;
}
.seat.active {
  border: 2px solid #ffe38b;
  box-shadow: 0 0 18px #f6d87580;
}
.seat.me {
  border: 2px solid #7ce4ad;
}
.seat.folded {
  opacity: .42;
  filter: grayscale(.7);
}
.avatar {
  width: 36px;
  height: 36px;
  margin: 0 auto 4px;
  border-radius: 50%;
  display: grid;
  place-items: center;
  background: linear-gradient(135deg,#eacb8c,#9b6d3d);
  border: 2px solid #f8df9c;
  color: #382514;
  font-size: 21px;
}
.seat-name {
  font-size: 13px;
  font-weight: bold;
  overflow-wrap: anywhere;
}
.seat-chips {
  color: #f3d77d;
  font-size: 12px;
  margin-top: 4px;
}
.seat-state {
  color: #d3e7d8;
  font-size: 11px;
  margin-top: 4px;
}
.badge {
  display: inline-block;
  margin: 3px 2px 0;
  padding: 2px 5px;
  border-radius: 5px;
  background: #b58a3e;
  color: #1c180d;
  font-size: 10px;
}
.seat-0 {
  top: 0;
  left: 50%;
  transform: translateX(-50%);
}
.seat-1 {
  top: 15%;
  right: 2%;
}
.seat-2 {
  top: 42%;
  right: 0;
}
.seat-3 {
  bottom: 0;
  right: 14%;
}
.seat-4 {
  bottom: 0;
  left: 14%;
}
.seat-5 {
  top: 42%;
  left: 0;
}
.seat-6 {
  top: 15%;
  left: 2%;
}
.seat-7 {
  top: 0;
  left: 20%;
}
.center-info {
  position: absolute;
  width: min(330px, 58%);
  left: 50%;
  top: 50%;
  transform: translate(-50%,-50%);
  text-align: center;
  padding: 16px 10px;
  border-radius: 18px;
  background: rgba(0,37,23,.72);
  border: 1px solid rgba(233,198,107,.45);
}
.pot-label {
  color: #cde4d6;
  font-size: 13px;
}
.pot-amount {
  margin: 4px 0;
  font-size: clamp(27px,4vw,42px);
  font-weight: 900;
  color: #ffe18b;
  text-shadow: 0 2px 8px #0008;
}
.turn-info {
  font-size: 13px;
  color: #f5edda;
  line-height: 1.7;
}
.my-cards {
  display: flex;
  justify-content: center;
  gap: 10px;
  min-height: 105px;
  margin: 18px auto 10px;
}
.card {
  position: relative;
  width: 65px;
  height: 94px;
  border-radius: 8px;
  background: #fffdf6;
  color: #171717;
  border: 1px solid #d8c9a8;
  box-shadow: 0 4px 10px #0005;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  padding: 7px;
  font-size: 22px;
  font-weight: bold;
}
.card.red {
  color: #c52e35;
}
.card .suit-bottom {
  transform: rotate(180deg);
  align-self: flex-end;
}
.card.back {
  color: #f3d88b;
  background: repeating-linear-gradient(
    45deg,
    #163f34,
    #163f34 5px,
    #235b49 5px,
    #235b49 10px
  );
  border: 2px solid #e7c775;
}
.card.back span {
  margin: auto;
  font-size: 29px;
}
.action-panel {
  margin-top: 18px;
  padding: 18px;
  border-radius: 18px;
  border: 1px solid rgba(233,198,107,.3);
  background: rgba(4,24,18,.86);
}
.action-heading {
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 10px;
  margin-bottom: 12px;
}
.action-heading h3 {
  margin: 0;
  color: var(--gold);
}
.actions {
  display: flex;
  flex-wrap: wrap;
  gap: 9px;
}
.btn-gold {
  background: linear-gradient(#f4dc91,#d3a947);
  color: #33240b;
}
.btn-green {
  background: #18764f;
  color: white;
}
.btn-red {
  background: #a42e35;
  color: white;
}
.btn-blue {
  background: #285f9a;
  color: white;
}
.action-hint {
  margin-top: 12px;
  color: #b8cfc1;
  font-size: 12px;
  line-height: 1.8;
}
.notice {
  margin-top: 12px;
  padding: 11px 13px;
  border-radius: 10px;
  background: #172e25;
  border: 1px solid #365b47;
  color: #e6efdf;
  font-size: 13px;
  line-height: 1.7;
}
.notice.warning {
  background: #482e17;
  border-color: #99713b;
}
.message {
  margin-top: 12px;
  min-height: 22px;
  color: #ffe18b;
  font-size: 13px;
}
.history {
  margin-top: 18px;
  padding: 15px;
  background: rgba(0,0,0,.25);
  border-radius: 14px;
  color: #d3e0d7;
  font-size: 13px;
  line-height: 1.8;
  overflow-wrap: anywhere;
}
.history h3 {
  color: var(--gold);
  margin: 0 0 8px;
}
@media (max-width: 700px) {
  .topbar {
    padding: 12px;
    align-items: flex-start;
  }
  .brand {
    font-size: 18px;
  }
  .page {
    padding: 10px;
  }
  .table-wrap {
    padding: 12px 4px;
  }
  .table {
    min-height: 470px;
    border-width: 7px;
  }
  .seats {
    inset: 25px 8px;
  }
  .seat {
    width: 88px;
    min-height: 78px;
    padding: 5px 3px;
  }
  .avatar {
    width: 28px;
    height: 28px;
    font-size: 16px;
  }
  .seat-name {
    font-size: 11px;
  }
  .seat-chips,
  .seat-state {
    font-size: 10px;
  }
  .seat-1 {
    right: 0;
    top: 14%;
  }
  .seat-2 {
    right: -2%;
    top: 42%;
  }
  .seat-3 {
    right: 6%;
    bottom: 0;
  }
  .seat-4 {
    left: 6%;
    bottom: 0;
  }
  .seat-5 {
    left: -2%;
    top: 42%;
  }
  .seat-6 {
    left: 0;
    top: 14%;
  }
  .seat-7 {
    left: 20%;
    top: 0;
  }
  .center-info {
    width: 59%;
    padding: 10px 4px;
  }
  .turn-info {
    font-size: 11px;
  }
  .card {
    width: 56px;
    height: 82px;
    font-size: 19px;
  }
  .action-panel {
    padding: 12px;
  }
  .actions button {
    flex: 1 1 28%;
    padding: 10px 6px;
  }
  input {
    width: 130px;
  }
}
</style>
</head>
<body>
<header class="topbar">
  <div>
    <div class="brand">♠ 炸金花</div>
    <div class="status" id="connectionStatus">正在连接服务器……</div>
  </div>
  <div class="top-actions">
    <button class="btn-secondary" id="copyRoomBtn">复制房间号</button>
    <button class="btn-danger" id="leaveBtn">退出房间</button>
  </div>
</header>

<main class="page">
  <section class="room-panel">
    <div>
      <div class="room-title">
        私人牌桌 <span id="roomLabel">未加入房间</span>
      </div>
      <div class="room-subtitle">
        最多 8 人 · 每人 300 积分 · 每局底注 5
      </div>
    </div>
    <div class="join-box">
      <input id="nameInput" maxlength="16" placeholder="你的昵称">
      <input id="roomInput" maxlength="12" placeholder="房间号">
      <button class="btn-gold" id="joinBtn">加入房间</button>
    </div>
  </section>

  <section class="table-wrap">
    <div class="table">
      <div class="table-label">POKER TABLE · 炸金花</div>
      <div class="seats" id="seats"></div>
      <div class="center-info">
        <div class="pot-label">🏆 当前底池</div>
        <div class="pot-amount" id="potAmount">0</div>
        <div class="turn-info" id="turnInfo">
          加入房间后开始游戏
        </div>
      </div>
    </div>
  </section>

  <section class="action-panel">
    <div class="action-heading">
      <h3>🃏 我的手牌</h3>
      <span id="handType">尚未发牌</span>
    </div>
    <div class="my-cards" id="myCards">
      <div class="card back"><span>♠</span></div>
      <div class="card back"><span>♥</span></div>
      <div class="card back"><span>♣</span></div>
    </div>
    <div class="action-heading">
      <h3>🎮 游戏操作</h3>
      <span id="turnLabel">等待加入房间</span>
    </div>
    <div class="actions">
      <button class="btn-green" id="blindBtn">闷牌下注</button>
      <button class="btn-blue" id="seeBtn">看牌</button>
      <button class="btn-gold" id="seenBetBtn">看牌下注</button>
      <button class="btn-red" id="foldBtn">弃牌</button>
      <button class="btn-gold" id="showBtn">比牌</button>
      <button class="btn-secondary" id="startBtn">开始新局</button>
      <button class="btn-danger" id="terminateBtn">终止本局</button>
    </div>
    <div class="action-hint">
      闷牌下注：5 / 10 / 15；看牌后下注：10 / 20 / 30。
      看牌后不能再闷牌。比牌费用为当前闷牌注的 2 倍。
      弃牌或退出时，已经投入的积分不退还。
    </div>
    <div class="notice warning">
      ⚠️ 退出或断线时，本局已下注的积分会留在底池；
      只有房主主动终止本局时，才退还本局投入的积分。
    </div>
    <div class="message" id="message"></div>
  </section>

  <section class="history">
    <h3>📜 牌局信息</h3>
    <div id="history">尚未加入房间。</div>
  </section>
</main>
<script>
(() => {
  'use strict';

  const $ = id => document.getElementById(id);

  let ws = null;
  let myId = null;
  let myName = '';
  let roomId = '';
  let state = null;
  let pendingAction = false;
  let reconnectTimer = null;
  let intentionalLeave = false;

  const suits = {
    S: '♠',
    H: '♥',
    C: '♣',
    D: '♦'
  };

  function setMessage(message, warning = false) {
    $('message').textContent = message || '';
    $('message').style.color = warning
      ? '#ff9d8d'
      : '#ffe18b';
  }

  function setConnection(message) {
    $('connectionStatus').textContent = message;
  }

  function send(data) {
    if (!ws || ws.readyState !== WebSocket.OPEN) {
      setMessage('尚未连接服务器，请稍后重试。', true);
      return false;
    }

    ws.send(JSON.stringify(data));
    return true;
  }

  function getPlayers() {
    return state && Array.isArray(state.players)
      ? state.players
      : [];
  }

  function getMe() {
    return getPlayers().find(p => p.id === myId) || null;
  }

  function isMyTurn() {
    return !!state && state.current === myId;
  }

  function isPlaying() {
    return !!state && state.phase === 'playing';
  }

  function escapeHtml(value) {
    return String(value ?? '').replace(/[&<>"']/g, char => ({
      '&': '&amp;',
      '<': '&lt;',
      '>': '&gt;',
      '"': '&quot;',
      "'": '&#39;'
    })[char]);
  }

  function cardParts(card) {
    if (!card) {
      return { rank: '?', suit: '?' };
    }

    if (typeof card === 'object') {
      const rank = card.rank ?? card.value ?? '?';
      const rawSuit = String(card.suit ?? '?');

      const map = {
        spades: 'S',
        spade: 'S',
        hearts: 'H',
        heart: 'H',
        clubs: 'C',
        club: 'C',
        diamonds: 'D',
        diamond: 'D',
        '黑桃': 'S',
        '红桃': 'H',
        '梅花': 'C',
        '方块': 'D',
        '♠': 'S',
        '♥': 'H',
        '♣': 'C',
        '♦': 'D'
      };

      const suit = map[rawSuit.toLowerCase()]
        || map[rawSuit]
        || rawSuit;

      return {
        rank: String(rank),
        suit: suits[suit] ? suit : '?'
      };
    }

    const match = String(card).match(
      /^(10|[2-9JQKA])([SHCD])$/i
    );

    if (match) {
      return {
        rank: match[1].toUpperCase(),
        suit: match[2].toUpperCase()
      };
    }

    return { rank: String(card), suit: '?' };
  }

  function makeCard(card) {
    const parts = cardParts(card);
    const symbol = suits[parts.suit] || '♦';

    const red =
      parts.suit === 'H' ||
      parts.suit === 'D';

    const div = document.createElement('div');
    div.className = 'card' + (red ? ' red' : '');

    const top = document.createElement('span');
    top.textContent = parts.rank + symbol;

    const middle = document.createElement('span');
    middle.style.textAlign = 'center';
    middle.style.fontSize = '30px';
    middle.textContent = symbol;

    const bottom = document.createElement('span');
    bottom.className = 'suit-bottom';
    bottom.textContent = parts.rank + symbol;

    div.append(top, middle, bottom);

    return div;
  }

  function renderCards() {
    const container = $('myCards');
    container.replaceChildren();

    const me = getMe();
    const hand = me && Array.isArray(me.hand)
      ? me.hand
      : [];

    if (hand.length === 3) {
      hand.forEach(card => {
        container.appendChild(makeCard(card));
      });

      $('handType').textContent =
        me.handType || me.label || '手牌已发放';
    } else {
      for (let i = 0; i < 3; i++) {
        const card = document.createElement('div');
        card.className = 'card back';

        const symbol = document.createElement('span');
        symbol.textContent = '♠';

        card.appendChild(symbol);
        container.appendChild(card);
      }

      $('handType').textContent = '尚未发牌';
    }
  }

  function seatPosition(index, total) {
    const angle =
      -Math.PI / 2 +
      (2 * Math.PI * index / Math.max(total, 1));

    return {
      left: (50 + 43 * Math.cos(angle)) + '%',
      top: (50 + 43 * Math.sin(angle)) + '%'
    };
  }

  function renderSeats() {
    const container = $('seats');
    container.replaceChildren();

    const players = getPlayers().slice(0, 8);

    players.forEach((player, index) => {
      const seat = document.createElement('div');
      seat.className = 'seat';

      const pos = seatPosition(index, players.length);

      seat.style.left = pos.left;
      seat.style.top = pos.top;
      seat.style.transform = 'translate(-50%, -50%)';

      if (player.id === myId) {
        seat.classList.add('me');
      }

      if (player.folded) {
        seat.classList.add('folded');
      }

      if (state && state.current === player.id) {
        seat.classList.add('active');
      }

      const avatar = document.createElement('div');
      avatar.className = 'avatar';
      avatar.textContent =
        player.id === myId ? '😎' : '🙂';

      const name = document.createElement('div');
      name.className = 'seat-name';
      name.textContent = player.name || '玩家';

      const chips = document.createElement('div');
      chips.className = 'seat-chips';
      chips.textContent =
        '💰 ' + (Number(player.chips) || 0);

      const playerState = document.createElement('div');
      playerState.className = 'seat-state';

      if (player.folded) {
        playerState.textContent = '已弃牌';
      } else if (player.id === state?.current) {
        playerState.textContent = '正在行动';
      } else if (player.seen) {
        playerState.textContent = '已看牌';
      } else {
        playerState.textContent = '闷牌中';
      }

      seat.append(avatar, name, chips, playerState);

      if (player.id === state?.dealer) {
        const dealer = document.createElement('span');
        dealer.className = 'badge';
        dealer.textContent = '庄家';
        seat.appendChild(dealer);
      }

      if (player.id === myId) {
        const badge = document.createElement('span');
        badge.className = 'badge';
        badge.textContent = '我';
        seat.appendChild(badge);
      }

      container.appendChild(seat);
    });
  }
  function renderHistory() {
    const players = getPlayers();
    const lines = [];

    lines.push('房间：' + (roomId || '未加入'));
    lines.push('玩家人数：' + players.length + ' / 8');
    lines.push('底池：' + (Number(state?.pot) || 0));
    lines.push(
      '当前闷牌注：' + (Number(state?.lastBlind) || 0)
    );

    if (state?.dealerName) {
      lines.push('庄家：' + state.dealerName);
    }

    if (state?.currentName && isPlaying()) {
      lines.push('当前行动：' + state.currentName);
    }

    if (state?.phase === 'finished') {
      lines.push('本局已经结束');
    }

    if (state?.phase === 'terminated') {
      lines.push('本局已被房主终止');
    }

    $('history').textContent = lines.join(' | ');
  }

  function render() {
    if (!state) return;

    const players = getPlayers();
    const me = getMe();

    $('roomLabel').textContent = roomId
      ? '· ' + roomId
      : '未加入房间';

    $('potAmount').textContent =
      Number(state.pot) || 0;

    if (state.phase === 'playing') {
      const currentName =
        state.currentName || '等待行动';

      $('turnInfo').textContent =
        '当前行动：' + currentName +
        '｜闷牌注：' +
        (Number(state.lastBlind) || 0);

      $('turnLabel').textContent = isMyTurn()
        ? '轮到你行动'
        : '等待其他玩家';
    } else if (state.phase === 'finished') {
      $('turnInfo').textContent = '本局已结束';
      $('turnLabel').textContent = '等待下一局';
    } else if (state.phase === 'terminated') {
      $('turnInfo').textContent = '本局已终止';
      $('turnLabel').textContent = '等待下一局';
    } else {
      $('turnInfo').textContent = '等待房主开始游戏';
      $('turnLabel').textContent = '等待开始';
    }

    const canAct =
      isPlaying() &&
      isMyTurn() &&
      !pendingAction;

    $('blindBtn').disabled =
      !canAct || !!me?.seen;

    $('seeBtn').disabled =
      !canAct || !!me?.seen;

    $('seenBetBtn').disabled = !canAct;
    $('foldBtn').disabled = !canAct;
    $('showBtn').disabled = !canAct;

    $('startBtn').disabled =
      !state.isHost ||
      state.phase === 'playing' ||
      players.filter(p => !p.folded).length < 2;

    $('terminateBtn').disabled =
      !state.isHost ||
      state.phase !== 'playing';

    renderSeats();
    renderCards();
    renderHistory();
  }

  function setPending(value) {
    pendingAction = value;
    render();
  }

  function action(actionName, extra = {}) {
    if (!state || !isPlaying()) {
      setMessage('当前没有正在进行的牌局。', true);
      return;
    }

    if (!isMyTurn()) {
      setMessage('还没轮到你行动。', true);
      return;
    }

    if (pendingAction) return;

    setPending(true);

    const sent = send({
      type: 'action',
      action: actionName,
      ...extra
    });

    if (!sent) {
      setPending(false);
      return;
    }

    setTimeout(() => {
      setPending(false);
    }, 1200);
  }

  function startGame() {
    if (!state || !state.isHost) {
      setMessage('只有房主可以开始新局。', true);
      return;
    }

    if (state.phase === 'playing') {
      setMessage('当前牌局尚未结束。', true);
      return;
    }

    send({ type: 'start' });
  }

  function terminateGame() {
    if (!state || !state.isHost) {
      setMessage('只有房主可以终止本局。', true);
      return;
    }

    if (state.phase !== 'playing') {
      setMessage('当前没有正在进行的牌局。', true);
      return;
    }

    const confirmed = confirm(
      '确定终止本局吗？\n\n' +
      '终止后，本局已经投入的积分将退还给玩家。'
    );

    if (!confirmed) return;

    send({ type: 'terminate' });
  }

  function joinRoom() {
    const name = $('nameInput').value.trim();
    const room = $('roomInput').value.trim();

    if (!name) {
      setMessage('请先输入昵称。', true);
      return;
    }

    if (!room) {
      setMessage('请先输入房间号。', true);
      return;
    }

    if (ws && ws.readyState === WebSocket.OPEN) {
      setMessage('当前已经连接，请先退出房间。', true);
      return;
    }

    myName = name;
    roomId = room;
    intentionalLeave = false;

    connect();
  }
  function connect() {
    const protocol =
      location.protocol === 'https:' ? 'wss:' : 'ws:';

    const socketUrl =
      protocol + '//' + location.host;

    setMessage('正在连接服务器……');

    try {
      ws = new WebSocket(socketUrl);
    } catch (error) {
      setMessage('连接失败，请刷新页面重试。', true);
      return;
    }

    ws.onopen = () => {
      setConnection(true);
      setMessage('连接成功，正在加入房间……');

      send({
        type: 'join',
        name: myName,
        room: roomId
      });
    };

    ws.onmessage = event => {
      let message;

      try {
        message = JSON.parse(event.data);
      } catch (error) {
        setMessage('收到无法识别的服务器消息。', true);
        return;
      }

      handleMessage(message);
    };

    ws.onerror = () => {
      setMessage('连接出现异常，请检查服务器状态。', true);
    };

    ws.onclose = () => {
      setConnection(false);
      state = null;
      renderSeats();
      renderCards();

      if (intentionalLeave) {
        setMessage('你已退出房间。');
      } else {
        setMessage('与服务器的连接已断开。', true);
      }

      $('startBtn').disabled = true;
      $('terminateBtn').disabled = true;

      if (!intentionalLeave) {
        setTimeout(() => {
          if (!ws || ws.readyState === WebSocket.CLOSED) {
            setMessage('可以重新加入房间。');
          }
        }, 1500);
      }
    };
  }

  function handleMessage(message) {
    if (!message || typeof message !== 'object') {
      return;
    }

    if (message.type === 'error') {
      setPending(false);
      setMessage(message.message || '操作失败。', true);
      return;
    }

    if (message.type === 'joined') {
      myId = message.playerId || message.id || myId;
      setMessage('成功加入房间：' + roomId);
      return;
    }

    if (message.type === 'state') {
      state = message.state || message;
      setPending(false);

      if (state.players) {
        const me = getMe();

        if (me) {
          $('myName').textContent = me.name || myName;
          $('myChips').textContent =
            Number(me.chips) || 0;
        }
      }

      render();
      return;
    }

    if (message.type === 'notice') {
      setMessage(message.message || '');
      return;
    }

    if (message.type === 'roundEnd') {
      setPending(false);
      setMessage(message.message || '本局结束。');
      return;
    }

    if (message.type === 'pong') {
      return;
    }

    if (message.state) {
      state = message.state;
      setPending(false);
      render();
    }
  }

  function leaveRoom() {
    if (!ws || ws.readyState === WebSocket.CLOSED) {
      setMessage('你当前没有连接房间。');
      return;
    }

    const confirmed = confirm(
      '确定退出房间吗？\n\n' +
      '请注意：已经下注的积分不会退还，' +
      '会继续留在本局底池中。\n\n' +
      '确定退出？'
    );

    if (!confirmed) return;

    intentionalLeave = true;

    if (ws.readyState === WebSocket.OPEN) {
      send({ type: 'leave' });
      ws.close();
    } else {
      ws.close();
    }

    state = null;
    setPending(false);
    renderSeats();
    renderCards();
    setMessage('正在退出房间……');
  }

  function chooseAmount(title, options) {
    const text = options.join(' / ');
    const answer = prompt(
      title + '\n可选金额：' + text,
      String(options[0])
    );

    if (answer === null) return null;

    const amount = Number(answer);

    if (!options.includes(amount)) {
      setMessage('金额不正确，请选择：' + text, true);
      return null;
    }

    return amount;
  }

  function chooseTarget() {
    const targets = state?.eligibleTargets || [];

    if (!targets.length) {
      setMessage('当前没有可以比牌的玩家。', true);
      return null;
    }

    const list = targets.map((target, index) => {
      if (typeof target === 'string') {
        return (index + 1) + '. ' + target;
      }

      return (index + 1) + '. ' +
        (target.name || target.id || '玩家');
    });

    const answer = prompt(
      '请选择比牌对象：\n' + list.join('\n') +
      '\n请输入序号：',
      '1'
    );

    if (answer === null) return null;

    const index = Number(answer) - 1;

    if (
      !Number.isInteger(index) ||
      index < 0 ||
      index >= targets.length
    ) {
      setMessage('选择无效，请重新操作。', true);
      return null;
    }

    const target = targets[index];

    return typeof target === 'string'
      ? target
      : target.id;
  }
  // 绑定页面按钮
  $('joinBtn').addEventListener('click', joinRoom);

  $('startBtn').addEventListener('click', startGame);

  $('terminateBtn').addEventListener(
    'click',
    terminateGame
  );

  $('leaveBtn').addEventListener('click', leaveRoom);

  $('blindBtn').addEventListener('click', () => {
    if (getMe()?.seen) {
      setMessage('看牌后不能再闷牌。', true);
      return;
    }

    const amount = chooseAmount(
      '请选择闷牌下注金额',
      [5, 10, 15]
    );

    if (amount === null) return;

    action('blind', { amount });
  });

  $('seeBtn').addEventListener('click', () => {
    action('see');
  });

  $('seenBetBtn').addEventListener('click', () => {
    const amount = chooseAmount(
      '请选择看牌下注金额',
      [10, 20, 30]
    );

    if (amount === null) return;

    action('seen', { amount });
  });

  $('foldBtn').addEventListener('click', () => {
    if (!confirm('确定弃牌吗？已下注的积分不会退还。')) {
      return;
    }

    action('fold');
  });

  $('showBtn').addEventListener('click', () => {
    const target = chooseTarget();

    if (!target) return;

    action('show', { target });
  });

  // 输入框回车快速加入
  $('nameInput').addEventListener('keydown', event => {
    if (event.key === 'Enter') joinRoom();
  });

  $('roomInput').addEventListener('keydown', event => {
    if (event.key === 'Enter') joinRoom();
  });

  // 页面初始化
  setConnection(false);
  renderSeats();
  renderCards();

  setMessage('请输入昵称和房间号，然后加入游戏。');
})();
</script>
</body>
</html>
